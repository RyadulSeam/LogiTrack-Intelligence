[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logitrack-intelligence"
version = "1.0.0"
description = "Enterprise Logistics Data & Predictive Operations Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ryadul Seam", email = "ryadulisla@gmail.com"},
]

# Core dependencies — installed for every phase
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
# Phase 1 — Data Audit & Profiling
audit = [
    "ydata-profiling>=4.6",
    "great-expectations>=0.18",
]

# Phase 2 — Synthetic Data Generation
simulation = [
    "faker>=20.0",
]

# Phase 3 — Database
database = [
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "duckdb>=0.9",
]

# Phase 4 — Batch ETL
etl = [
    "pyarrow>=14.0",
]

# Phase 5 — Streaming
streaming = [
    "paho-mqtt>=1.6",
]

# Phase 6 — dbt Warehouse
warehouse = [
    "dbt-core>=1.7",
    "dbt-postgres>=1.7",
]

# Phase 7 — Dashboards
dashboards = [
    "streamlit>=1.29",
    "plotly>=5.18",
    "pydeck>=0.8",
    "folium>=0.15",
]

# Phase 8-9 — ML & Forecasting
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "prophet>=1.1",
    "statsmodels>=0.14",
    "shap>=0.44",
    "mlflow>=2.9",
]

# Phase 10 — API
api = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "httpx>=0.25",
]

# Phase 11 — Testing & CI
testing = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
]

# Install everything
all = [
    "logitrack-intelligence[audit]",
    "logitrack-intelligence[simulation]",
    "logitrack-intelligence[database]",
    "logitrack-intelligence[etl]",
    "logitrack-intelligence[streaming]",
    "logitrack-intelligence[warehouse]",
    "logitrack-intelligence[dashboards]",
    "logitrack-intelligence[ml]",
    "logitrack-intelligence[api]",
    "logitrack-intelligence[testing]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
