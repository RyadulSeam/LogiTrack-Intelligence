logitrack:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/lake/logitrack.duckdb"
      threads: 2
      memory_limit: '2GB'
    prod:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      password: "{{ env_var('DB_PASSWORD', '') }}"
      port: 5432
      dbname: "{{ env_var('DB_NAME', 'logitrack') }}"
      schema: warehouse
      threads: 4
