name: LogiTrack Intelligence — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Code Quality & Static Analysis
  # ─────────────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting dependencies
        run: |
          pip install --upgrade pip
          pip install ruff black isort

      - name: Run ruff linter
        run: ruff check src/ tests/ --output-format=github

      - name: Check import ordering (isort)
        run: isort --check-only --diff src/ tests/

      - name: Check code formatting (black)
        run: black --check src/ tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Full Test Suite with Coverage
  # ─────────────────────────────────────────────────────────────────────────
  test-suite:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project & test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[database,ml,api,testing]"
          pip install pytest-cov coverage

      - name: Seed DuckDB lakehouse for tests
        run: |
          python -c "
          from logitrack.transformation.warehouse_builder import build_warehouse_tables
          build_warehouse_tables()
          print('Warehouse built successfully.')
          "
        continue-on-error: false

      - name: Run Foundation Tests
        run: pytest tests/test_foundation.py -v --tb=short

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src/logitrack \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml

      - name: Run Data Quality Tests
        run: |
          pytest tests/data_quality/ -v --tb=short

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short

      - name: Run API Endpoint Tests
        run: |
          pytest tests/api/ -v --tb=short \
            --cov=src/logitrack/api \
            --cov-append \
            --cov-report=xml:coverage-api.xml

      - name: Run End-to-End Pipeline Tests
        run: |
          pytest tests/end_to_end/ -v --tb=short

      - name: Run Full Test Suite with Combined Coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/logitrack \
            --cov-report=term-missing \
            --cov-report=xml:coverage-full.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=55

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: |
            coverage-full.xml
            htmlcov/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: coverage-full.xml
          flags: unittests
          name: LogiTrack-Intelligence
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — System Health Monitor Validation
  # ─────────────────────────────────────────────────────────────────────────
  health-check:
    name: System Health Monitor
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[database,ml,api,testing]"

      - name: Build warehouse for health check
        run: |
          python -c "
          from logitrack.transformation.warehouse_builder import build_warehouse_tables
          from logitrack.forecasting.train_all import main as train_all
          build_warehouse_tables()
          print('Warehouse ready.')
          "

      - name: Run health monitoring validation
        run: |
          pytest tests/unit/test_monitoring.py -v --tb=short

      - name: Run forecasting quality validation
        run: |
          pytest tests/unit/test_forecasting_quality.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4 — API Smoke Test
  # ─────────────────────────────────────────────────────────────────────────
  api-smoke-test:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[database,ml,api,testing]"

      - name: Build warehouse for API tests
        run: |
          python -c "
          from logitrack.transformation.warehouse_builder import build_warehouse_tables
          build_warehouse_tables()
          print('Warehouse ready for API tests.')
          "

      - name: Run API endpoint tests
        run: |
          pytest tests/api/ tests/end_to_end/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5 — Build Verification Report
  # ─────────────────────────────────────────────────────────────────────────
  build-report:
    name: Build Verification Report
    runs-on: ubuntu-latest
    needs: [code-quality, test-suite, health-check, api-smoke-test]
    if: always()

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-py3.11
          path: coverage-reports/

      - name: Generate CI Build Summary
        run: |
          echo "## 🚀 LogiTrack Intelligence — CI/CD Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ needs.test-suite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Monitor | ${{ needs.health-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Smoke Test | ${{ needs.api-smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
